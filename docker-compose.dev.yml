services:

  db:
    image: postgres:14
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_HOST=${POSTGRES_HOST?Variable not set}
      - POSTGRES_PORT=${POSTGRES_PORT?Variable not set}

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    networks:
      - default
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
        interval: 10s
        timeout: 5s
        retries: 5
    volumes:
      - static:/backend/static/
      - media:/backend/media/
      - ./logs:/var/log/app
    command: bash /scripts/start-prod.sh

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - PORT=3000
    networks:
      - default
    command: sh -c 'npm run start'
    # command: sh -c 'next start'  # попробовать как зальют


  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - frontend
    ports:
      - "9000:80"
    volumes:
      - static:/static/
      - media:/media/
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - default

  redis:
    image: redis:alpine
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    volumes:
      - media:/backend/media
      - ./logs:/var/log/app
    networks:
      - default
    command: /backend/.venv/bin/celery -A config worker --loglevel=info

  celery_beat:
    build: ./backend
    env_file: .env
    command: /backend/.venv/bin/celery -A config beat -l info
    volumes:
      - media:/backend/media
      - ./logs:/var/log/app
    depends_on:
      celery:
        condition: service_started
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  db-data:
  static:
  media:
